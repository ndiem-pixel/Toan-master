<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bé Vui Học Toán Lớp 1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#fff7ed);color:#1f2937}.app{max-width:1100px;margin:auto;padding:16px}header,.panel{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #4338ca18;margin-bottom:16px}header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0 0 8px}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:bold}.nav button,.topic{background:#fff;border:2px solid #e2e8f0}.nav button.active,.topic.active{background:#ede9fe;border-color:#8b5cf6;color:#5b21b6}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#ffffff25;padding:10px;border-radius:12px;text-align:center}.stat b{display:block;font-size:24px}.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.topic{text-align:left;min-height:90px}.topic span{display:block;font-size:28px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field select{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:10px}.primary{background:#4f46e5;color:#fff}.secondary{background:#0f766e;color:#fff}.danger{background:#be123c;color:#fff}.hidden{display:none!important}.quiz{border:3px dashed #c4b5fd;background:#fafaff;border-radius:18px;text-align:center;padding:22px}.illustration{font-size:55px;min-height:70px}.quiz h2{font-size:clamp(24px,5vw,38px);color:#312e81}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}.option{background:#fff;border:3px solid #cbd5e1;font-size:23px}.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}.feedback{margin-top:14px;padding:14px;border-radius:12px;font-weight:bold}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.progress{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#22c55e}.result{text-align:center}.big{font-size:52px;color:#4f46e5;font-weight:bold}.history{width:100%;border-collapse:collapse}.history th,.history td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}@media(max-width:600px){.app{padding:9px}header,.panel{padding:16px;border-radius:17px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>🌟 Bé Vui Học Toán Lớp 1</h1><p>Học mà chơi - Chơi mà giỏi!</p></div><div class="stats"><div class="stat"><b id="totalScore">0</b>Điểm</div><div class="stat"><b id="totalStars">0 ⭐</b>Ngôi sao</div><div class="stat"><b id="rounds">0</b>Bài đã làm</div></div></header>
<div class="nav"><button class="active" data-view="learn">📚 Học</button><button data-view="practice">🎯 Luyện tập</button><button data-view="exam">📝 Kiểm tra</button><button data-view="history">🏆 Kết quả</button></div>
<section id="learn" class="panel view"><h2>Chọn chủ đề</h2><div id="topics" class="topics"></div><h2>Thiết lập</h2><div class="controls"><div class="field"><label>Mức độ</label><select id="learnLevel"><option value="easy">🌱 Cơ bản</option><option value="medium">🌼 Khá</option><option value="hard">🚀 IQ</option></select></div><div class="field"><label>Số câu</label><select id="learnCount"><option>5</option><option selected>10</option><option>15</option></select></div></div><p id="topicInfo"></p><button class="primary" id="startLearn">▶ Bắt đầu học</button></section>
<section id="practice" class="panel view hidden"><h2>🎯 Luyện tập tổng hợp</h2><div class="controls"><div class="field"><label>Mức độ</label><select id="practiceLevel"><option value="easy">🌱 Cơ bản</option><option value="medium">🌼 Khá</option><option value="hard">🚀 IQ</option></select></div><div class="field"><label>Số câu</label><select id="practiceCount"><option>5</option><option selected>10</option><option>15</option></select></div></div><button class="primary" id="startPractice">▶ Bắt đầu</button></section>
<section id="exam" class="panel view hidden"><h2>📝 Kiểm tra cuối buổi</h2><div class="controls"><div class="field"><label>Nội dung</label><select id="examTopic"></select></div><div class="field"><label>Mức độ</label><select id="examLevel"><option value="easy">🌱 Cơ bản</option><option value="medium">🌼 Khá</option><option value="hard">🚀 IQ</option></select></div><div class="field"><label>Số câu</label><select id="examCount"><option>10</option><option selected>15</option><option>20</option></select></div></div><button class="primary" id="startExam">📝 Bắt đầu kiểm tra</button></section>
<section id="history" class="panel view hidden"><h2>🏆 Lịch sử kết quả</h2><div id="historyBox"></div><button class="danger" id="clearHistory">🗑 Xóa lịch sử</button></section>
<section id="quiz" class="panel hidden"><div><b id="mode"></b> · <b id="quizTopic"></b><span style="float:right" id="counter"></span></div><div class="progress"><div id="bar"></div></div><p>Điểm: <b id="score">0</b> · ⭐ <b id="stars">0</b></p><div class="quiz"><div class="illustration" id="pic">🌟</div><h2 id="question"></h2><div class="options" id="options"></div></div><div id="feedback"></div><p id="encourage"></p><button class="secondary" id="read">🔊 Nghe câu hỏi</button> <button class="secondary" id="guide">🗣️ Nghe hướng dẫn</button> <button class="danger" id="stop">⏹ Dừng</button> <button class="primary" id="next" disabled>Câu tiếp theo ➜</button></section>
<section id="result" class="panel result hidden"><h2>🎉 Hoàn thành!</h2><p id="date"></p><div class="big" id="finalScore"></div><p id="summary"></p><p id="message"></p><button class="primary" id="retry">🔁 Làm lại</button> <button class="secondary" id="home">🏠 Trang chính</button></section>
</div>
<script>
const topics=[['numbers','🔢','Làm quen với số'],['add','➕','Phép cộng'],['sub','➖','Phép trừ'],['compare','⚖️','So sánh > < ='],['geometry','🔺','Hình học'],['measure','📏','Đo lường'],['word','📖','Toán có lời văn'],['pattern','🧠','Tư duy IQ']];
let selected='add',cfg=null,qs=[],idx=0,score=0,stars=0,correct=0,wrong=0,answered=false;
let totals=JSON.parse(localStorage.getItem('mathTotals')||'{"score":0,"stars":0,"rounds":0}'),records=JSON.parse(localStorage.getItem('mathRecords')||'[]');
const $=x=>document.getElementById(x),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>a.sort(()=>Math.random()-.5);
function stats(){ $('totalScore').textContent=totals.score;$('totalStars').textContent=totals.stars+' ⭐';$('rounds').textContent=totals.rounds;localStorage.setItem('mathTotals',JSON.stringify(totals))}
function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.78;u.pitch=1.15;speechSynthesis.speak(u)}
function tone(ok){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:220;g.gain.value=.1;o.start();o.stop(c.currentTime+.3)}catch(e){}}
function make(topic,level){let m=level==='easy'?10:level==='medium'?20:30,a,b,ans,text,pic='🌟',guide;
if(topic==='add'){a=rand(0,m);b=rand(0,m-a);ans=a+b;text=`${a} + ${b} = ?`;pic='🍎'.repeat(Math.min(a,7))+'🍊'.repeat(Math.min(b,7));guide=`Con hãy gộp ${a} đồ vật với ${b} đồ vật. Kết quả là ${ans}.`}
else if(topic==='sub'){a=rand(1,m);b=rand(0,a);ans=a-b;text=`${a} − ${b} = ?`;pic='🍎'.repeat(Math.min(a,9));guide=`Có ${a} đồ vật, bớt ${b} đồ vật thì còn ${ans}.`}
else if(topic==='compare'){a=rand(0,m);b=rand(0,m);ans=a>b?'>':a<b?'<':'=';text=`Điền dấu: ${a} ☐ ${b}`;pic='⚖️';guide='So sánh hai số. Số lớn hơn dùng dấu lớn hơn, số bé hơn dùng dấu bé hơn, hai số bằng nhau dùng dấu bằng.'}
else if(topic==='numbers'){a=rand(0,level==='easy'?10:100);ans=a;text=`Số liền sau ${a===100?99:a} là số nào?`;if(a===100)ans=100;pic='🔢';guide='Số liền sau là số lớn hơn một đơn vị.'}
else if(topic==='geometry'){let z=[['hình tròn','⚪'],['hình vuông','🟦'],['hình tam giác','🔺'],['hình chữ nhật','▭']][rand(0,3)];ans=z[0];text='Đây là hình gì?';pic=z[1];guide='Hãy quan sát hình và chọn tên đúng.'}
else if(topic==='measure'){a=rand(2,9);b=rand(1,9);ans=a>b?'dài hơn':a<b?'ngắn hơn':'bằng nhau';text=`Dây A dài ${a} đơn vị, dây B dài ${b} đơn vị. Dây A thế nào?`;pic='📏';guide='So sánh hai số đo để biết độ dài.'}
else if(topic==='word'){a=rand(1,8);b=rand(1,8);ans=a+b;text=`Lan có ${a} quả táo, mẹ cho thêm ${b} quả. Lan có tất cả bao nhiêu quả?`;pic='🍎';guide=`Muốn biết tất cả, con tính ${a} + ${b}.`}
else{a=rand(1,5);b=rand(1,4);ans=a+b*3;text=`Tìm số còn thiếu: ${a}, ${a+b}, ${a+2*b}, ☐`;pic='🧩';guide=`Dãy số tăng thêm ${b} mỗi lần. Hãy cộng ${b} vào số trước.`}
let opts=[ans];while(opts.length<4){let v=typeof ans==='number'?Math.max(0,ans+rand(-5,5)):['>','<','='].includes(ans)?['>','<','='][rand(0,2)]:['dài hơn','ngắn hơn','bằng nhau','hình tròn','hình vuông','hình tam giác','hình chữ nhật'][rand(0,6)];if(!opts.includes(v))opts.push(v)}
return{text,ans,opts:shuffle(opts),pic,guide}}
function build(topic,level,n){return Array.from({length:n},()=>make(topic==='all'?topics[rand(0,7)][0]:topic,level))}
function views(v){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$('quiz').classList.add('hidden');$('result').classList.add('hidden');$(v).classList.remove('hidden');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{views(b.dataset.view);if(b.dataset.view==='history')historyRender()});
$('topics').innerHTML=topics.map(t=>`<button class="topic ${t[0]===selected?'active':''}" data-topic="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{selected=b.dataset.topic;document.querySelectorAll('[data-topic]').forEach(x=>x.classList.toggle('active',x===b));$('topicInfo').textContent='Đã chọn: '+topics.find(t=>t[0]===selected)[2]});
$('examTopic').innerHTML='<option value="all">🎲 Tổng hợp</option>'+topics.map(t=>`<option value="${t[0]}">${t[1]} ${t[2]}</option>`).join('');
function start(mode,topic,level,n){cfg={mode,topic,level,n};qs=build(topic,level,n);idx=0;score=0;stars=0;correct=0;wrong=0;views('quiz');$('mode').textContent=mode==='exam'?'KIỂM TRA':mode==='practice'?'LUYỆN TẬP':'HỌC TẬP';$('quizTopic').textContent=(topics.find(t=>t[0]===topic)||['','','Tổng hợp'])[2];render()}
function render(){let q=qs[idx];answered=false;$('counter').textContent=`Câu ${idx+1}/${qs.length}`;$('bar').style.width=idx/qs.length*100+'%';$('score').textContent=score;$('stars').textContent=stars;$('pic').textContent=q.pic;$('question').textContent=q.text;$('feedback').className='';$('feedback').textContent='';$('encourage').textContent='';$('options').innerHTML=q.opts.map(o=>`<button class="option">${o}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b,b.textContent));$('next').disabled=true}
function answer(btn,val){if(answered)return;answered=true;let q=qs[idx],ok=String(val)===String(q.ans);if(ok){score+=10;stars++;correct++;totals.score+=10;totals.stars++;btn.classList.add('correct');$('feedback').className='feedback good';$('feedback').textContent='✅ Chính xác! Con được +10 điểm.';$('encourage').textContent='🌟 Tuyệt vời! Con đang tiến bộ từng ngày!';tone(true);say('Chính xác! Con làm rất tốt. Con được mười điểm.')}else{wrong++;btn.classList.add('wrong');document.querySelectorAll('.option').forEach(b=>{if(b.textContent===String(q.ans))b.classList.add('correct')});$('feedback').className='feedback bad';$('feedback').textContent='💡 Đáp án đúng là: '+q.ans+'. '+q.guide;$('encourage').textContent='🌱 Không sao! Con hãy xem lại và thử lại nhé!';tone(false);say('Chưa đúng rồi. Đáp án đúng là '+q.ans+'. Con hãy cố gắng lần sau nhé.')}stats();$('score').textContent=score;$('stars').textContent=stars;$('next').disabled=false}
$('next').onclick=()=>idx<qs.length-1?(idx++,render()):finish();
function finish(){totals.rounds++;stats();let date=new Date().toLocaleString('vi-VN'),pct=Math.round(correct/qs.length*100);records.unshift({date,topic:(topics.find(t=>t[0]===cfg.topic)||['','','Tổng hợp'])[2],score,correct,wrong,total:qs.length,pct});records=records.slice(0,30);localStorage.setItem('mathRecords',JSON.stringify(records));$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('date').textContent='Ngày giờ: '+date;$('finalScore').textContent=score+' điểm';$('summary').textContent=`Đúng ${correct}/${qs.length} câu · Sai ${wrong} câu · Tỷ lệ ${pct}% · ${stars} ⭐`;$('message').textContent=pct>=80?'🏆 Xuất sắc!':pct>=50?'👏 Rất đáng khen!':'💖 Con hãy luyện thêm, con sẽ tiến bộ!'}
$('startLearn').onclick=()=>start('learn',selected,$('learnLevel').value,+$('learnCount').value);$('startPractice').onclick=()=>start('practice','all',$('practiceLevel').value,+$('practiceCount').value);$('startExam').onclick=()=>start('exam',$('examTopic').value,$('examLevel').value,+$('examCount').value);$('retry').onclick=()=>start(cfg.mode,cfg.topic,cfg.level,cfg.n);$('home').onclick=()=>views('learn');$('read').onclick=()=>say(qs[idx].text);$('guide').onclick=()=>say(qs[idx].guide);$('stop').onclick=()=>speechSynthesis.cancel();
function historyRender(){if(!records.length){$('historyBox').innerHTML='<p>Chưa có kết quả. Hãy làm một bài nhé! 🌟</p>';return}$('historyBox').innerHTML='<table class="history"><tr><th>Ngày giờ</th><th>Nội dung</th><th>Điểm</th><th>Kết quả</th></tr>'+records.map(r=>`<tr><td>${r.date}</td><td>${r.topic}</td><td>${r.score}</td><td>${r.correct}/${r.total} (${r.pct}%)</td></tr>`).join('')+'</table>'}
$('clearHistory').onclick=()=>{if(confirm('Xóa toàn bộ lịch sử?')){records=[];localStorage.removeItem('mathRecords');historyRender()}};stats();
</script>
</body>
</html>
