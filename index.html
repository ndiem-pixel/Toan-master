<title>Bé Vui Học Toán Lớp 1</title>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=zRMiDG4kxLXgSoLA9EE4a8IRKD-i_F1SmNkbVCEu2VQQH39xRWxhYMjCr6_x6TZjYY_AIvhYCpZ_7h1OhmgNifs5QzrXmh0evyULMOhOScF8x47PxY12-StBrECWefTsr5UyLnNZtRQ1ecY1EF_8auGdVmp9g_VJsl7-t83rfHPRP8WyNZ512hvy27SKpRUuqrdV0Xmhkj0CE84DPcv83rViW2X8JAlHH4mRphgjNauprLfNzNg15NZh3vaG9JlNOunoL2RUhQg6dgm-cBx9IYtQTA6gCnv3bH5vwqIVhdGmIdR-iGUjk9a9jUdfy4JMEMvygaEOVSiWFkiqT6fmOg" charset="UTF-8"></script><link rel="stylesheet" crossorigin="anonymous" href="https://gc.kis.v2.scr.kaspersky-labs.com/E3E8934C-235A-4B0E-825A-35A08381A191/abn/main.css?attr=aHR0cHM6Ly9jaGF0Z3B0LmNvbS9iYWNrZW5kLWFwaS9lc3R1YXJ5L2NvbnRlbnQ_aWQ9ZmlsZV8wMDAwMDAwMGU1OWM4MjA2YTI5ZGJhZGQyYzhlYjE0NyZmbj1iZS12dWktaG9jLXRvYW4tbG9wLTEtaG9hbi10aGllbi5odG1sJmNkPWF0dGFjaG1lbnQmdHM9NDk3MDkwJnA9ZnMmY2lkPTEmc2lnPTFiMDg1MTQxMTA5YjFlZmFmOGVkNTRjZjU3YWU3NTE0Y2IyMzU1ZjhkZjAwMzY3ZmY5NDI1ODljYzI2OGVkODUmdj0w"/><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff6cf,#dff6ff);color:#263238}.app{max-width:960px;margin:auto;padding:16px}header,.card{background:#fff;border-radius:26px;box-shadow:0 10px 28px #0001}header{text-align:center;padding:22px}h1{margin:4px;color:#ff7043;font-size:clamp(28px,6vw,45px)}.sub{font-size:18px}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{background:#fff3cd;padding:10px 17px;border-radius:22px;font-weight:bold}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:17px 0}button,select{font:inherit}nav button,.action,.answer{border:0;border-radius:16px;padding:12px 18px;font-weight:bold;cursor:pointer}nav button{background:#fff;box-shadow:0 4px 12px #0001}nav button.active{background:#ff8a65;color:#fff}.card{text-align:center;padding:24px}.topic{font-size:20px;color:#607d8b;font-weight:bold}.instruction{background:#eef8ff;border-radius:18px;padding:14px;margin:15px auto;max-width:760px;font-size:19px;line-height:1.5}.visual{min-height:120px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;font-size:48px}.question{font-size:clamp(30px,7vw,48px);font-weight:bold;margin:15px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.action{color:#fff;background:#42a5f5}.stop{background:#78909c}.speed{padding:10px;border:2px solid #dce5e9;border-radius:14px;background:#fff}.answers{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:14px;max-width:600px;margin:20px auto}.answer{background:#e8f5e9;font-size:26px;min-height:68px}.answer:disabled{opacity:1}.correct{background:#b9f6ca!important}.wrong{background:#ffcdd2!important}.feedback{min-height:45px;font-size:20px;font-weight:bold;line-height:1.4}.progress{height:14px;background:#eceff1;border-radius:20px;overflow:hidden;max-width:600px;margin:15px auto}.progress span{display:block;height:100%;width:0;background:#66bb6a;transition:.3s}.next{background:#ffb300!important}.help{color:#78909c;font-size:15px;line-height:1.5;margin-top:15px}footer{text-align:center;color:#607d8b;padding:18px}@media(max-width:560px){.card{padding:17px}.answers{gap:9px}.answer{font-size:22px}.visual{font-size:38px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🌟 Bé Vui Học Toán 🌟</h1><div class="sub">Toán lớp 1 – Nghe cô hướng dẫn – Quan sát – Trả lời</div><div class="stats"><div class="stat">⭐ Điểm: <span id="score">0</span></div><div class="stat">🏆 Sao: <span id="stars">0</span></div><div class="stat">📝 Câu: <span id="qnum">1</span>/10</div></div></header>
<nav><button class="active" onclick="setMode('add',this)">➕ Phép cộng</button><button onclick="setMode('sub',this)">➖ Phép trừ</button><button onclick="setMode('mix',this)">🎯 Ôn tập tổng hợp</button></nav>
<section class="card">
<div class="topic" id="topic"></div><div class="instruction" id="instruction"></div><div class="visual" id="visual"></div><div class="question" id="question"></div>
<div class="actions"><button class="action" onclick="speakGuide()">🔊 Nghe cô hướng dẫn</button><button class="action" onclick="speakQuestion()">🗣️ Đọc câu hỏi</button><button class="action stop" onclick="stopSpeech()">⏹ Dừng đọc</button><select class="speed" id="speed" aria-label="Tốc độ đọc"><option value=".62">🐢 Rất chậm</option><option value=".75" selected>🙂 Chậm, rõ</option><option value=".9">🚶 Bình thường</option></select></div>
<div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="progress"><span id="progress"></span></div><button class="action next" id="nextBtn" onclick="nextQuestion()" hidden>➡️ Câu tiếp theo</button><div class="help">💡 Bé có thể nghe cô hướng dẫn nhiều lần. Hãy đếm từng hình thật chậm nhé!</div>
</section><footer>💖 Mỗi câu trả lời là một bước tiến bộ của bé!</footer>
</div>
<script>
let mode='add',score=0,stars=0,qIndex=1,currentAnswer=0,answered=false,currentText='';
const objects=['🍎','🍊','🍓','🍌','🍇','⭐','🧸'];
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n);

function makeQuestion(){
 answered=false;$('answers').innerHTML='';$('feedback').textContent='';$('nextBtn').hidden=true;$('nextBtn').textContent='➡️ Câu tiếp theo';
 let a,b,op;
 if(mode==='add'){op='+';a=rand(6);b=rand(11-a)}
 else if(mode==='sub'){op='−';a=rand(11);b=rand(a+1)}
 else if(Math.random()<.5){op='+';a=rand(6);b=rand(11-a)}
 else{op='−';a=rand(11);b=rand(a+1)}
 currentAnswer=op==='+'?a+b:a-b;
 currentText=op==='+'?`${a} cộng ${b} bằng bao nhiêu?`:`${a} trừ ${b} bằng bao nhiêu?`;
 $('question').textContent=`${a} ${op} ${b} = ?`;
 $('topic').textContent=op==='+'?'Bài học: Phép cộng trong phạm vi 10':'Bài học: Phép trừ trong phạm vi 10';
 $('instruction').textContent=op==='+'?'👩‍🏫 Cô hướng dẫn: Bé hãy đếm nhóm đồ vật thứ nhất, sau đó đếm tiếp nhóm thứ hai. Hai nhóm có tất cả bao nhiêu đồ vật?':'👩‍🏫 Cô hướng dẫn: Bé hãy đếm tất cả đồ vật, rồi bớt đi số đồ vật được yêu cầu. Còn lại bao nhiêu?';
 const icon=objects[rand(objects.length)],left=Array(a).fill(icon).join(' '),right=Array(b).fill(icon).join(' ');
 $('visual').textContent=op==='+'?`${left} ➕ ${right}`:`${left} ➖ ${right}`;
 const options=new Set([currentAnswer]);while(options.size<4)options.add(Math.max(0,Math.min(10,currentAnswer+rand(7)-3)));
 [...options].sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.setAttribute('aria-label','Đáp án '+v);b.onclick=()=>checkAnswer(v,b);$('answers').appendChild(b)});
 $('qnum').textContent=qIndex;$('progress').style.width=((qIndex-1)*10)+'%';
}
function checkAnswer(v,b){
 if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);
 if(v===currentAnswer){score+=10;stars++;b.classList.add('correct');$('feedback').textContent='🎉 Chính xác! Bé giỏi quá!';playSound(true);speakText('Chính xác! Bé giỏi quá!')}
 else{b.classList.add('wrong');document.querySelectorAll('.answer').forEach(x=>{if(Number(x.textContent)===currentAnswer)x.classList.add('correct')});$('feedback').textContent=`😊 Chưa đúng rồi. Đáp án đúng là ${currentAnswer}. Bé hãy cố gắng lần sau nhé!`;playSound(false);speakText(`Chưa đúng rồi. Đáp án đúng là ${currentAnswer}. Bé hãy cố gắng lần sau nhé!`)}
 $('score').textContent=score;$('stars').textContent=stars;$('nextBtn').hidden=false;
 if(qIndex===10){$('progress').style.width='100%';$('nextBtn').textContent='🏆 Xem kết quả'}
}
function nextQuestion(){if(qIndex===10){stopSpeech();alert(`🌟 Chúc mừng bé!\n\nBé đạt ${score} điểm và nhận ${stars} ngôi sao.`);qIndex=1;score=0;stars=0;$('score').textContent=0;$('stars').textContent=0}else qIndex++;makeQuestion()}
function setMode(m,b){mode=m;qIndex=1;score=0;stars=0;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('score').textContent=0;$('stars').textContent=0;makeQuestion()}
function voice(){const vs=speechSynthesis.getVoices(),vi=vs.filter(v=>(v.lang||'').toLowerCase().startsWith('vi')),keys=['female','woman','nữ','nu','linh','mai','huyen','hoai','thuy'];return vi.find(v=>keys.some(k=>(v.name||'').toLowerCase().includes(k)))||vi[0]||null}
function speakText(text){if(!('speechSynthesis'in window)){alert('Thiết bị chưa hỗ trợ đọc tiếng Việt.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=Number($('speed').value);u.pitch=1.15;u.volume=1;const v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}
function speakGuide(){speakText($('instruction').textContent.replace('👩‍🏫 Cô hướng dẫn: ',''))}
function speakQuestion(){speakText(currentText)}
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function playSound(ok){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC(),ns=ok?[523.25,659.25,783.99]:[220,196];ns.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.13;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.15,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.24)})}
makeQuestion();
</script>
</body>
</html>
